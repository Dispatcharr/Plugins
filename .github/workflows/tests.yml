name: Tests

# Runs pluginctl and custom CodeQL query tests. Dual purpose:
#   - on push to main for any change outside plugins/ (tooling CI)
#   - via workflow_call from validate-plugin.yml, so a repo-update PR's result
#     feeds the Plugin PR Check gate and the PR comment
# Runs with a read-only token and no secrets, so testing PR merge-ref code is
# low-risk.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'plugins/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (empty checks out the default for the event).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github/codeql
            .github/pluginctl
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run test suite
        working-directory: .github/pluginctl
        run: python -m pytest -q

      - name: Initialize CodeQL
        id: codeql
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Install CodeQL query test dependencies
        run: ${{ steps.codeql.outputs.codeql-path }} pack install --additional-packs=..
        working-directory: .github/codeql/queries/python/tests

      - name: Run CodeQL query tests
        run: |
          ${{ steps.codeql.outputs.codeql-path }} query compile --check-only .github/codeql/queries/python
          ${{ steps.codeql.outputs.codeql-path }} test run --additional-packs=.github/codeql/queries/python .github/codeql/queries/python/tests
