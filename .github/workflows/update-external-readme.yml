name: Publish Plugin Docs PR

# Reads the README.md generated by the Publish Plugins workflow from the
# releases branch and opens (or updates) a PR in a target repository.

env:
  PYTHONPATH: .github/pluginctl/src

on:
  workflow_run:
    workflows: ["Publish Plugins"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        id: config
        env:
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          EXTERNAL_README_REPO: ${{ vars.EXTERNAL_README_REPO }}
          EXTERNAL_README_PATH: ${{ vars.EXTERNAL_README_PATH }}
        run: |
          if [[ -z "${GH_APP_ID:-}" || -z "${GH_APP_PRIVATE_KEY:-}" || -z "${EXTERNAL_README_REPO:-}" || -z "${EXTERNAL_README_PATH:-}" ]]; then
            echo "::notice::GH_APP_ID, GH_APP_PRIVATE_KEY, EXTERNAL_README_REPO, or EXTERNAL_README_PATH not configured - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the base branch checked out: the composite action and pluginctl live
      # here. The releases-branch README is read via the origin/releases ref below.
      - name: Checkout base branch (trusted)
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: GitHub App token
        if: steps.config.outputs.skip != 'true'
        id: token
        uses: ./.github/actions/gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch releases branch
        if: steps.config.outputs.skip != 'true'
        run: git fetch origin releases

      - name: Create or update external README PR
        if: steps.config.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPO: ${{ vars.EXTERNAL_README_REPO }}
          TARGET_PATH: ${{ vars.EXTERNAL_README_PATH }}
          SOURCE_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_REVIEWER: ${{ vars.PR_REVIEWER }}
        run: python -m pluginctl external-readme
