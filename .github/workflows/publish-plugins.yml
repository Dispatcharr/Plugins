name: Publish Plugins

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: .github/pluginctl/src

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.github/workflows/publish-plugins.yml'
      - '.github/pluginctl/**'
      - '.github/scripts/keys/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Check this to clear and rebuild plugin ZIPs from scratch. Scope is controlled by force_rebuild_plugin below. Requires CONFIRM in force_rebuild_confirm.'
        type: boolean
        default: false
        required: false
      force_rebuild_plugin:
        description: 'Optional: plugin slug to target (e.g. dispatcharr-exporter). Only that plugin is cleared and rebuilt, all others are untouched. Leave blank to wipe and rebuild the entire releases branch (WARNING: purges all version history).'
        type: string
        default: ''
        required: false
      force_rebuild_confirm:
        description: 'Required when force_rebuild is checked: type CONFIRM to proceed. Leave blank at all other times.'
        type: string
        default: ''
        required: false

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GitHub App token
        id: token
        uses: ./.github/actions/gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Publish plugins to releases branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          FORCE_REBUILD_CONFIRM: ${{ inputs.force_rebuild_confirm }}
          FORCE_REBUILD_PLUGIN: ${{ inputs.force_rebuild_plugin }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -o pipefail
          if [[ "${FORCE_REBUILD}" == "true" && "${FORCE_REBUILD_CONFIRM}" != "CONFIRM" ]]; then
            echo "::error::force_rebuild requires typing CONFIRM in the force_rebuild_confirm input."
            exit 1
          fi
          python -m pluginctl publish ${{ github.ref_name }} 2>&1 | tee publish.log

      - name: Generate job summary
        if: always()
        run: |
          echo "## Published Plugins" >> $GITHUB_STEP_SUMMARY
          if [ -f publish.log ]; then
            if grep -q "Successfully published" publish.log; then
              echo "✅ Publishing completed successfully" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Publishing failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "See logs for details." >> $GITHUB_STEP_SUMMARY
            fi
          fi
