name: Auto-merge Plugin Updates

# After every successful validation, this workflow either squash-merges an
# eligible pure plugin version-bump update or marks the PR for manual review.
# AUTO_MERGE_UPDATES controls merging, not the review decision. New plugins,
# repo/tooling changes, invalid PRs, and mixed changes require review.
# AUTO_MERGE_BLACKLIST is an optional comma-separated list of authors excluded
# only from automatic merges.
# Rate limits default to four author and plugin merges per rolling 24 hours;
# override with AUTO_MERGE_AUTHOR_LIMIT, AUTO_MERGE_PLUGIN_LIMIT, and
# AUTO_MERGE_RATE_WINDOW_HOURS.
#
# Merges require the GitHub App token because its pushes cascade into the publish
# workflow. Without it, the PR is marked for review instead of falling back to
# GITHUB_TOKEN.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: .github/pluginctl/src

on:
  workflow_run:
    workflows: ["Validate Plugin"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Serialize candidates so each rate-limit check sees earlier merges.
      group: auto-merge-updates-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout base branch (trusted)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 0

      - name: GitHub App token
        id: token
        uses: ./.github/actions/gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Decide auto-merge or request review
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          AUTO_MERGE_BLACKLIST: ${{ vars.AUTO_MERGE_BLACKLIST || '' }}
          AUTO_MERGE_AUTHOR_LIMIT: ${{ vars.AUTO_MERGE_AUTHOR_LIMIT || '' }}
          AUTO_MERGE_PLUGIN_LIMIT: ${{ vars.AUTO_MERGE_PLUGIN_LIMIT || '' }}
          AUTO_MERGE_RATE_WINDOW_HOURS: ${{ vars.AUTO_MERGE_RATE_WINDOW_HOURS || '' }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_UPDATES == 'true' }}
          USE_APP: ${{ steps.token.outputs.use_app }}
        run: |
          if [[ "$AUTO_MERGE_ENABLED" != "true" ]]; then
            python -m pluginctl automerge --head-sha "$HEAD_SHA" \
              --disabled-reason "Automatic merging is disabled for this repository."
          elif [[ "$USE_APP" != "true" ]]; then
            python -m pluginctl automerge --head-sha "$HEAD_SHA" \
              --disabled-reason "GitHub App credentials are not configured for automatic merging."
          else
            python -m pluginctl automerge --head-sha "$HEAD_SHA"
          fi
