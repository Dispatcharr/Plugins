name: Auto-merge Plugin Updates

# Opt-in via the AUTO_MERGE_UPDATES repo variable. When enabled, squash-merges
# a PR automatically once "Validate Plugin" succeeds, but ONLY for pure plugin
# version-bump updates. Never for new plugins, repo/tooling changes, invalid
# PRs, or PRs that mix a new plugin with an update.
#
# Runs the merge with the GitHub App token specifically (never GITHUB_TOKEN):
# pushes authored by the App's bot identity correctly cascade into
# publish-plugins.yml's `on: push` trigger, whereas GITHUB_TOKEN-authored pushes
# are exempt from triggering other workflows. If the App isn't configured,
# auto-merge is skipped entirely rather than falling back.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: .github/pluginctl/src

on:
  workflow_run:
    workflows: ["Validate Plugin"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && vars.AUTO_MERGE_UPDATES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-merge-updates-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout base branch (trusted)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 0

      - name: GitHub App token
        id: token
        uses: ./.github/actions/gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Skip - GitHub App not configured
        if: steps.token.outputs.use_app != 'true'
        run: |
          echo "::notice::GH_APP_ID or GH_APP_PRIVATE_KEY not configured. Skipping auto-merge (merging with GITHUB_TOKEN would not trigger publish-plugins.yml)."

      - name: Auto-merge pure plugin update
        if: steps.token.outputs.use_app == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python -m pluginctl automerge --head-sha "$HEAD_SHA"
